name: Deploy Flappy Bird to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── Job 1: Validate the HTML file ──────────────────────────────────────────
  check:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs/index.html exists
        run: |
          if [ ! -f "docs/index.html" ]; then
            echo "❌ docs/index.html not found!"
            exit 1
          fi
          echo "✅ docs/index.html found"

      - name: Validate HTML structure
        run: |
          for tag in "<!DOCTYPE html>" "<html" "<head" "<body" "<canvas" "<script"; do
            if grep -qi "$tag" docs/index.html; then
              echo "✅ Found: $tag"
            else
              echo "❌ Missing: $tag"
              exit 1
            fi
          done
          echo "✅ All checks passed"

  # ── Job 2: Deploy to GitHub Pages ──────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"          # ← only the docs/ folder is served

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
